# In case the grid doesn't come from the MITgcm grid
manual_grid: {
  # Rotation parameters
  'lat0': 46.5,          # Central latitude (degrees) (None if computed from the MITgcm grid)
  'y0': 0,            # Central latitude y-coordinate (km)

  'mitgcm_grid': False,    # True if grid is generated based on the MITgcm grid
  'dx': 400,              # Grid spacing in x-direction (m)
  'dy': 400,              # Grid spacing in y-direction (m)
  'x_range': (500, 565),  # Domain extent in x (km)
  'y_range': (117, 155),  # Domain extent in y (km)
}
